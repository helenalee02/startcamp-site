<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오 - 메인</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
                        muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
                        accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            :root {
                --background: 0 0% 100%; --foreground: 240 10% 3.9%;
                --primary: 240 5.9% 10%; --primary-foreground: 0 0% 98%;
                --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 46.1%;
                --accent: 240 4.8% 95.9%; --accent-foreground: 240 5.9% 10%;
                --border: 240 5.9% 90%; --input: 240 5.9% 90%;
                --ring: 240 10% 3.9%; --radius: 0.5rem;
            }
            .dark {
                --background: 240 10% 3.9%; --foreground: 0 0% 98%;
                --primary: 0 0% 98%; --primary-foreground: 240 5.9% 10%;
                --muted: 240 3.7% 15.9%; --muted-foreground: 240 5% 64.9%;
                --accent: 240 3.7% 15.9%; --accent-foreground: 0 0% 98%;
                --border: 240 3.7% 15.9%; --input: 240 3.7% 15.9%;
                --ring: 240 4.9% 83.9%;
            }
            * { @apply border-border; }
            body { @apply bg-background text-foreground antialiased; }
        }
        .nav-link.active { @apply text-foreground font-semibold relative; }
        .nav-link.active::after {
            content: '';
            @apply absolute -bottom-[21px] left-0 w-full h-[2px] bg-foreground;
        }
    </style>
</head>
<body class="min-h-screen">

    <div id="header-placeholder"></div>

    <main class="container mx-auto px-4 py-20 max-w-screen-md">
        <h1 class="text-4xl font-bold mb-6 tracking-tight" data-kr="안녕하세요,<br>프론트엔드 개발자입니다." data-en="Hello,<br>I'm a Frontend Developer.">안녕하세요,<br>프론트엔드 개발자입니다.</h1>
        <p class="text-muted-foreground mb-12 text-lg" data-kr="상단의 스크롤바와 다크모드, 언어 전환을 테스트해 보세요." data-en="Test the scrollbar, dark mode, and language toggle above.">상단의 스크롤바와 다크모드, 언어 전환을 테스트해 보세요.</p>
        
        <div class="space-y-8">
            <div class="h-64 rounded-xl border bg-card text-card-foreground shadow-sm p-6 flex items-center justify-center bg-muted/30">콘텐츠 1</div>
        </div>
    </main>

    <script src="js/common.js"></script>
</body>
</html>
