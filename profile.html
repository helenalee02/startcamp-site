<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐣 삐약이 프론트엔드 개발자 - 프로필</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: "hsl(var(--border))", input: "hsl(var(--input))", ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))", foreground: "hsl(var(--foreground))",
                        primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))", },
                        muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))", },
                        accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))", }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            :root {
                --background: 48 100% 97%; --foreground: 24 50% 20%; --primary: 45 93% 55%; --primary-foreground: 24 50% 20%; 
                --muted: 45 40% 90%; --muted-foreground: 24 20% 50%; --accent: 30 100% 85%; --accent-foreground: 24 50% 20%;
                --border: 45 30% 85%; --input: 45 30% 85%; --ring: 45 93% 55%; --radius: 1rem;
            }
            .dark {
                --background: 24 20% 12%; --foreground: 48 100% 90%; --primary: 45 93% 50%; --primary-foreground: 24 20% 12%;
                --muted: 24 20% 20%; --muted-foreground: 48 40% 70%; --accent: 24 30% 25%; --accent-foreground: 48 100% 90%;
                --border: 24 20% 25%; --input: 24 20% 25%; --ring: 45 93% 50%;
            }
            * { @apply border-border; }
            body { 
                @apply bg-background text-foreground antialiased; 
            }
        }
        .nav-link.active { @apply text-primary font-bold relative; }
        .nav-link.active::after { content: ''; @apply absolute -bottom-[21px] left-1/2 -translate-x-1/2 w-8 h-[3px] bg-primary rounded-t-md; }
    </style>

    <style>
        body { 
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" style="font-size: 28px;"><text y="28">🐥</text></svg>'), auto !important;
        }
        a, button, [role="button"], input, select, textarea, .nav-link, .cursor-pointer {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" style="font-size: 28px;"><text y="28">🐣</text></svg>'), pointer !important;
        }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">

    <canvas id="bg-canvas" class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-60"></canvas>

    <div id="header-placeholder"></div>

    <!-- 메인 프로필 섹션 -->
    <main class="container mx-auto px-4 py-24 max-w-screen-md relative z-10">
        <!-- 상단 헤더 타이틀 -->
        <div class="mb-12">
            <p class="text-primary font-black text-sm tracking-widest mb-2 flex items-center gap-2">
                <span class="bg-primary/20 px-2 py-0.5 rounded-md text-xs font-bold">02</span> PROFILE
            </p>
            <h1 class="text-4xl font-black tracking-tight" data-kr="저는 이런 사람이에요" data-en="About Me">
                저는 이런 사람이에요
            </h1>
        </div>
        
        <!-- 프로필 정보 그리드 (2열 구조, 목표 카드는 하단 전체 너비) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            
            <!-- Name Card -->
            <div class="p-6 rounded-2xl border-2 border-primary/20 bg-card/80 text-card-foreground shadow-md backdrop-blur-sm transition-transform hover:-translate-y-1 duration-300 flex items-center space-x-4">
                <div class="p-3 rounded-xl bg-orange-100 text-orange-500 dark:bg-orange-950/40">
                    <i data-lucide="user" class="h-6 w-6"></i>
                </div>
                <div>
                    <div class="text-xs font-semibold text-muted-foreground uppercase tracking-wider">Name</div>
                    <div class="text-xl font-bold mt-0.5" data-kr="이가은" data-en="Gaeun Lee">이가은</div>
                </div>
            </div>

            <!-- Age Card -->
            <div class="p-6 rounded-2xl border-2 border-primary/20 bg-card/80 text-card-foreground shadow-md backdrop-blur-sm transition-transform hover:-translate-y-1 duration-300 flex items-center space-x-4">
                <div class="p-3 rounded-xl bg-orange-100 text-orange-500 dark:bg-orange-950/40">
                    <i data-lucide="calendar" class="h-6 w-6"></i>
                </div>
                <div>
                    <div class="text-xs font-semibold text-muted-foreground uppercase tracking-wider">Age</div>
                    <div class="text-xl font-bold mt-0.5" data-kr="25세 (02년생)" data-en="25 (Born in '02)">25세 (02년생)</div>
                </div>
            </div>

            <!-- Major Card -->
            <div class="p-6 rounded-2xl border-2 border-primary/20 bg-card/80 text-card-foreground shadow-md backdrop-blur-sm transition-transform hover:-translate-y-1 duration-300 flex items-center space-x-4">
                <div class="p-3 rounded-xl bg-orange-100 text-orange-500 dark:bg-orange-950/40">
                    <i data-lucide="graduation-cap" class="h-6 w-6"></i>
                </div>
                <div>
                    <div class="text-xs font-semibold text-muted-foreground uppercase tracking-wider">Major</div>
                    <div class="text-xl font-bold mt-0.5" data-kr="데이터사이언스학과" data-en="Data Science">데이터사이언스학과</div>
                </div>
            </div>

            <!-- MBTI Card -->
            <div class="p-6 rounded-2xl border-2 border-primary/20 bg-card/80 text-card-foreground shadow-md backdrop-blur-sm transition-transform hover:-translate-y-1 duration-300 flex items-center space-x-4">
                <div class="p-3 rounded-xl bg-orange-100 text-orange-500 dark:bg-orange-950/40">
                    <i data-lucide="sparkles" class="h-6 w-6"></i>
                </div>
                <div>
                    <div class="text-xs font-semibold text-muted-foreground uppercase tracking-wider">MBTI</div>
                    <div class="text-xl font-bold mt-0.5" data-kr="ENTP" data-en="ENTP">ENTP</div>
                </div>
            </div>

        </div>

        <!-- Goal Card (하단에 길게 배치하여 균형감 부여) -->
        <div class="p-6 rounded-2xl border-2 border-primary/25 bg-primary/5 text-card-foreground shadow-md backdrop-blur-sm transition-transform hover:-translate-y-1 duration-300 flex items-center space-x-4">
            <div class="p-3 rounded-xl bg-primary text-primary-foreground shadow-sm animate-pulse">
                <i data-lucide="cpu" class="h-6 w-6"></i>
            </div>
            <div>
                <div class="text-xs font-semibold text-orange-600/80 dark:text-orange-400 uppercase tracking-wider">Goal</div>
                <div class="text-xl font-black mt-0.5 text-foreground" data-kr="AI를 잘 활용하는 개발자" data-en="A developer who brings AI to life">
                    AI를 잘 활용하는 개발자
                </div>
            </div>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script>
        // Lucide 아이콘 초기화 스크립트 추가
        lucide.createIcons();
    </script>
</body>
</html>
